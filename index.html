<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Enrollment</title>

    <style>
        body {
            background-image: url(https://www.meralco.com.ph/uploads/images/business-stories/v2/business-story-b710fdecdc1da13ec939.png?v=1788411681);background-position: center; background-size: cover; background-attachment: fixed; min-height: 100vh; flex-direction: column;  margin: 0; display: flex; 
        }

         .content-wrapper {
            align-items: center; justify-content: center; flex: 1; justify-content: center; padding: 40px 20px; align-items: center; display: flex;
        }
     
        .logo {
            height: 40px;  width: auto;
        }
     

        footer {
            background-color: black;
            color: #ccc;
            text-align: center;
            padding: 15px 0;
            margin-top: auto;
        }

        .dropdown-item:hover{
            background-color: #198754; color: white;
        }

        .form-card {
    max-width: 850px;
   
    background-color: rgba(255, 255, 255, 0.70) !important; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
    
    </style>

</head>

<body>
        <header class="bg-black sticky-top shadow">
        <nav class="navbar navbar-expand-lg navbar-dark py-1">
            <div class="container">

                <a class="navbar-brand d-flex align-items-center" href="index.html">
                    <img src="images (6).jpe" alt="OBMC Logo" class="logo">
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topNavigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="topNavigation">
                    <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-4">
                        <li class="nav-item">
                            <a class="nav-link text-white fw-semibold" href="index.html">Enroll Now</a>
                        </li>
                       
                    </ul>

                    <div class="d-flex flex-column flex-lg-row align-items-stretch align-items-lg-center gap-2">
                        <form class="d-flex" role="search">
                            <input class="form-control form-control-sm me-2 bg-dark text-white border-secondary" type="search" placeholder="Search site..." aria-label="Search">
                            <button class="btn btn-success btn-sm px-3" type="submit">Search</button>
                        </form>
                    </div>
                </div>
            </div>
        </nav>
    </header>


    <header class="hero-image text-center d-flex align-items-center justify-content-center">
        <div>
            <h1 class="display-4  shadow-text text-white">OBMC Enrollment Form</h1>
           <p class="fs-3 shadow-text text-white">Contact Us</p>
        </div>
    </header>

 <div class="container mb-5">
        <div class="form-card bg-light p-4 p-md-5 rounded shadow mx-auto">
            <form>
                <h2 class="h5 mb-3 fw-normal text-center">Information</h2>

            
                <div class="mb-3">
                    <div class="mb-3">
                        <label for="senderName" class="form-label small">Full Name</label>
                        <input type="text" class="form-control" id="senderName" placeholder="Ben- Walid A. Bocarie">
                    </div>
                    <div class="mb-3">
                        <label for="senderEmail" class="form-label small">Email Address</label>
                        <input type="email" class="form-control" id="senderEmail" placeholder="bocarie@gmail.com">
                    </div>
                </div>

               
                <div class="mb-3">
                    <div class="mb-3">
                        <label for="senderPhone" class="form-label small">Contact Number</label>
                        <input type="tel" class="form-control" id="senderPhone" placeholder="0912-345-6789">
                    </div>
                    <div class="mb-3">
                       <label for="birthDate" class="form-label small">Birth Date</label>
                     <input type="date" class="form-control" id="birthDate">
                    </div>
                    <div class="mb-3">
                        <label for="campusSelect" class="form-label small">Campus</label>
                        <select class="form-select" id="campusSelect" required>
                            <option selected disabled value="">Select Gender...</option>
                            <option value="greenhills">Female</option>
                            <option value="fairview">Male</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="gradeLevel" class="form-label small">Grade Level</label>
                        <select class="form-select" id="campusSelect" required>
                            <option selected disabled value="">Select Grade Level...</option>
                            <option value="juniorcasa">Junior Casa</option>
                            <option value="junioradvancedcasa">Junior Advanced Casa</option>
                            <option value="advancedcasa">Advanced Casa</option>
                            <option value="grade1">Grade 1</option>
                            <option value="grade2">Grade 2</option>
                            <option value="grade3">Grade 3</option>
                            <option value="grade4">Grade 4</option>
                            <option value="grade5">Grade 5</option>
                            <option value="grade6">Grade 6</option>
                            <option value="grade7">Grade 7</option>
                            <option value="grade8">Grade 8</option>
                            <option value="grade9">Grade 9</option>
                            <option value="grade10">Grade 10</option>
                            <option value="grade11">Grade 11</option>
                            <option value="grade12">Grade 12</option>
                        </select>
                    <div class="mb-3">
                        <label for="campusSelect" class="form-label small">Campus</label>
                        <select class="form-select" id="campusSelect" required>
                            <option selected disabled value="">Select Campus...</option>
                            <option value="greenhills">Greenhills</option>
                            <option value="fairview">Fairview</option>
                            <option value="laspinas">Las Piñas</option>
                            <option value="staana">Sta. Ana</option>
                            <option value="angeles">Angeles</option>
                        </select>
                    </div>
                </div>

               
                <div class="mb-3">
                    <label for="subject" class="form-label small">Subject</label>
                    <input type="text" class="form-control" id="subject" placeholder="Enrollment Inquiry" required>
                </div>

              
                <div class="mb-4">
                    <label for="messageBox" class="form-label small">Message</label>
                    <textarea class="form-control" id="messageBox" rows="4" placeholder="Write your message or inquiry here..." required></textarea>
                </div>

                <!-- Submit Button -->
                <div class="text-center">
                    <button type="submit" class="btn btn-success px-4">Send Message</button>
                </div>
             <div>
            
        </div>
                
            </form>
        </div>
    </div>
   
        </div>
    </div>
       
    <footer>
        <div class="container">
            <small> © 2026 OB Montessori Center. All rights reserved. </small>
        </div>
    </footer>
</body>
</html>
